<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Super Mario Bros (Plus)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: #1a0a00;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Press Start 2P', 'Courier New', monospace;
    overflow: hidden;
  }
  #wrapper {
    position: relative;
    display: inline-block;
    box-shadow: 0 0 60px rgba(255,80,0,0.5), 0 0 120px rgba(200,40,0,0.3), inset 0 0 40px rgba(0,0,0,0.5);
    border: 3px solid #8B3000;
    border-radius: 4px;
  }
  canvas {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  #controls {
    color: #A07040;
    font-size: 9px;
    text-align: center;
    margin-top: 8px;
    letter-spacing: 1px;
  }
  #touch-controls {
    display: none;
    position: absolute;
    bottom: 10px;
    left: 0; right: 0;
    justify-content: space-between;
    padding: 0 10px;
    pointer-events: none;
  }
  .d-pad { display: flex; gap: 4px; pointer-events: all; }
  .touch-btn {
    width: 50px; height: 50px;
    background: rgba(255,255,255,0.25);
    border: 2px solid rgba(255,255,255,0.4);
    border-radius: 8px;
    color: white;
    font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    user-select: none;
    -webkit-user-select: none;
    cursor: pointer;
  }
  @media (max-width: 700px) {
    #touch-controls { display: flex; }
  }
</style>
</head>
<body>
<div id="wrapper">
  <canvas id="c"></canvas>
  <div id="touch-controls">
    <div class="d-pad">
      <div class="touch-btn" id="btn-left">◀</div>
      <div class="touch-btn" id="btn-right">▶</div>
    </div>
    <div class="touch-btn" id="btn-jump" style="width:70px;height:70px;font-size:22px;">🅐</div>
  </div>
</div>
<div id="controls">← → MOVER &nbsp;|&nbsp; SPACE/↑ SALTAR &nbsp;|&nbsp; SHIFT CORRER &nbsp;|&nbsp; ↑/↓ NIVEL</div>
<script>
// ------------------------------------------------------------
//  SUPER MARIO BROS (PLUS): 6 niveles temáticos
// ------------------------------------------------------------
// Este archivo reemplaza y extiende el anterior mario-plus.html
// Temas: clasico, desierto, subterraneo, cielo, castillo
// ------------------------------------------------------------

//--  NIVELES Y FUNCIONES NUEVOS --//
// AGREGADO: 4 nuevos niveles temáticos

function buildLevel3() { // DESIERTO (arena, pirámide, cactus)
  for (let i=0;i<60;i++) addGround(i*TILE);
  for (let i=62;i<112;i++) addGround(i*TILE);
  for (let i=115;i<210;i++) addGround(i*TILE);
  // Pirámide y cactus (stair blocks + pipe)
  for (let s=0;s<5;s++)
    for (let r=0;r<=s;r++) addBlock((20+s)*TILE, (11-r)*TILE, 'stair', 'coin');
  for (let i=0;i<3;i++) addPipe((40+i*10)*TILE, GROUND_Y-2*TILE, 2);
  for (let i=0;i<5;i++) addBlock((80+i)*TILE, 8*TILE, 'brick', 'coin');
  for (let i=0;i<4;i++) addBlock((100+i)*TILE, 7*TILE, 'question', (i%2?'mushroom':'coin'));
  for (let s=0;s<7;s++)
    for (let r=0;r<=s;r++) addBlock((150+s)*TILE, (11-r)*TILE, 'stair', 'coin');
  // Coin line
  for (let i=0;i<30;i++) addCoin(120+i, 7);
  addPipe(180*TILE, GROUND_Y-2*TILE, 2);
  // flag/castle
  const poleX = 200*TILE;
  platforms.push({x:poleX+10, y:3*TILE, w:5, h:GROUND_Y-3*TILE, type:'flagpole', solid:false, flagY:0});
  for (let i=0;i<6;i++) for (let j=0;j<5;j++) addBlock((202+i)*TILE, (8+j)*TILE, 'castle');
  for (let i=0;i<8;i++) addBlock((201+i)*TILE, 12*TILE, 'castle');
  // enemies
  const epos = [15,45,66,72,80,101,125,137,151,176,190];
  for(const ex of epos) addEnemy(ex);
}

function buildLevel4() { // SUBTERRANEO
  for (let i=0;i<20;i++) addGround(i*TILE);
  for (let i=22;i<48;i++) addGround(i*TILE);
  for (let i=50;i<78;i++) addGround(i*TILE);
  for (let i=80;i<130;i++) addGround(i*TILE);
  for (let i=132;i<210;i++) addGround(i*TILE);
  // "piedras" flotantes
  for(let k=0;k<8;k++) addBlock((17+k)*TILE, 5*TILE, 'brick', 'coin');
  for(let k=0;k<5;k++) addBlock((60+k)*TILE, 8*TILE, 'question', k%2?'mushroom':'coin');
  for(let i=0;i<6;i++) addBlock((90+i)*TILE, 8*TILE, 'brick', 'coin');
  for(let s=0;s<6;s++) for(let r=0;r<=s;r++) addBlock((120+s)*TILE, (11-r)*TILE, 'stair', 'coin');
  // flag/castle
  const poleX=200*TILE;
  platforms.push({x:poleX+10, y:3*TILE,w:5,h:GROUND_Y-3*TILE,type:'flagpole',solid:false,flagY:0});
  for (let i=0;i<3;i++) for (let j=0;j<7;j++) addBlock((202+i)*TILE,(8+j)*TILE,'castle');
  for(let i=0;i<8;i++) addBlock((201+i)*TILE,12*TILE,'castle');
  // enemies
  const epos=[10,15,31,45,61,92,98,114,136,168];
  for(const ex of epos) addEnemy(ex);
}

function buildLevel5() { // CIELO
  for(let i=0;i<28;i++) addGround(i*TILE);
  for(let j=0;j<7;j++) for(let i=0;i<4;i++) addBlock((30+8*j+i)*TILE, (8-j)*TILE, 'brick', 'coin');
  for(let i=0;i<20;i++) addBlock((80+i)*TILE, 5*TILE+(Math.sin(i)*18), 'question', (i%8==0)?'mushroom':'coin');
  // plataformas flotantes
  for(let i=0;i<7;i++) addBlock((120+i*5)*TILE, 7*TILE-(i%2)*25, 'brick', 'coin');
  for(let i=0;i<15;i++) addCoin(90+i*2,4+(i%2));
  // escalera
  for(let s=0;s<5;s++) for(let r=0;r<=s;r++) addBlock((170+s)*TILE, (11-r)*TILE, 'stair', 'coin');
  // flag/castle
  const poleX=200*TILE;
  platforms.push({x:poleX+10,y:3*TILE,w:5,h:GROUND_Y-3*TILE,type:'flagpole',solid:false,flagY:0});
  for(let i=0;i<6;i++) for(let j=0;j<5;j++) addBlock((202+i)*TILE,(8+j)*TILE,'castle');
  for(let i=0;i<8;i++) addBlock((201+i)*TILE,12*TILE,'castle');
  // enemies
  const epos=[11,34,55,88,102,117,139,151,158];
  for(const ex of epos) addEnemy(ex);
}

function buildLevel6() { // CASTILLO
  for(let i=0;i<25;i++) addGround(i*TILE);
  for(let i=27;i<75;i++) addGround(i*TILE);
  for(let i=80;i<120;i++) addGround(i*TILE);
  for(let i=125;i<210;i++) addGround(i*TILE);
  // LAVA (apenas decorativo: línea visual)
  for(let i=30;i<45;i++) addCoin(i,13);
  // muros
  for(let i=0;i<6;i++) for(let j=0;j<4+i;j++) addBlock((50+i)*TILE,(12-j)*TILE,'castle');
  for(let s=0;s<8;s++) for(let r=0;r<=s;r++) addBlock((140+s)*TILE,(11-r)*TILE,'stair','coin');
  // flag/castle
  const poleX=200*TILE;
  platforms.push({x:poleX+10,y:3*TILE,w:5,h:GROUND_Y-3*TILE,type:'flagpole',solid:false,flagY:0});
  for(let i=0;i<6;i++) for(let j=0;j<5;j++) addBlock((202+i)*TILE,(8+j)*TILE,'castle');
  for(let i=0;i<8;i++) addBlock((201+i)*TILE,12*TILE,'castle');
  // enemies
  const epos=[6,15,21,42,60,78,97,128,134,176,190];
  for(const ex of epos) addEnemy(ex);
}

const levels = [
  { name: '1-1',    time: 300, theme: 'classic',     build: buildLevel1 },
  { name: '1-2',    time: 320, theme: 'classic',     build: buildLevel2 },
  { name: '1-3',    time: 320, theme: 'desert',      build: buildLevel3 },
  { name: '1-4',    time: 330, theme: 'underground', build: buildLevel4 },
  { name: '2-1',    time: 300, theme: 'sky',         build: buildLevel5 },
  { name: '2-2',    time: 340, theme: 'castle',      build: buildLevel6 },
];
