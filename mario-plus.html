<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Super Mario Bros (Plus)</title>
<link rel="stylesheet" href="mario-plus.css">
</head>
<body>
<div id="wrapper">
  <canvas id="c"></canvas>
  <div id="touch-controls">
    <div class="d-pad">
      <div class="touch-btn" id="btn-left">◀</div>
      <div class="touch-btn" id="btn-right">▶</div>
    </div>
    <div class="touch-btn" id="btn-jump" style="width:70px;height:70px;font-size:22px;">🅐</div>
  </div>
</div>
<div id="controls">← → MOVER &nbsp;|&nbsp; SPACE/↑ SALTAR &nbsp;|&nbsp; SHIFT CORRER &nbsp;|&nbsp; ↑/↓ NIVEL</div>

<script src="mario-plus.js"></script>
</body>
</html>
