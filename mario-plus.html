<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Super Mario Bros (Plus)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: #1a0a00;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Press Start 2P', 'Courier New', monospace;
    overflow: hidden;
  }
  #wrapper {
    position: relative;
    display: inline-block;
    box-shadow: 0 0 60px rgba(255,80,0,0.5), 0 0 120px rgba(200,40,0,0.3), inset 0 0 40px rgba(0,0,0,0.5);
    border: 3px solid #8B3000;
    border-radius: 4px;
  }
  canvas {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  #controls {
    color: #A07040;
    font-size: 9px;
    text-align: center;
    margin-top: 8px;
    letter-spacing: 1px;
  }
  #touch-controls {
    display: none;
    position: absolute;
    bottom: 10px;
    left: 0; right: 0;
    justify-content: space-between;
    padding: 0 10px;
    pointer-events: none;
  }
  .d-pad { display: flex; gap: 4px; pointer-events: all; }
  .touch-btn {
    width: 50px; height: 50px;
    background: rgba(255,255,255,0.25);
    border: 2px solid rgba(255,255,255,0.4);
    border-radius: 8px;
    color: white;
    font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    user-select: none;
    -webkit-user-select: none;
    cursor: pointer;
  }
  @media (max-width: 700px) {
    #touch-controls { display: flex; }
  }
</style>
</head>
<body>
<div id="wrapper">
  <canvas id="c"></canvas>
  <div id="touch-controls">
    <div class="d-pad">
      <div class="touch-btn" id="btn-left">◀</div>
      <div class="touch-btn" id="btn-right">▶</div>
    </div>
    <div class="touch-btn" id="btn-jump" style="width:70px;height:70px;font-size:22px;">🅐</div>
  </div>
</div>
<div id="controls">← → MOVER &nbsp;|&nbsp; SPACE/↑ SALTAR &nbsp;|&nbsp; SHIFT CORRER &nbsp;|&nbsp; ↑/↓ NIVEL</div>

</html>
